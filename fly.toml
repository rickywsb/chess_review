# fly.toml app configuration file generated for ricky-chess-review on 2026-08-25T21:28:21-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ricky-chess-review'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'
[env]
  # Balanced accuracy/cost: fixed-depth search gives deterministic quality
  # regardless of hardware; one dedicated (unthrottled) core keeps cost low.
  CHESS_ENGINE_THREADS = "1"
  CHESS_ENGINE_HASH_MB = "1024"
  CHESS_REVIEW_DEPTH = "18"
  CHESS_REVIEW_MAX_DEPTH = "26"
  # Abuse / cost guards for the public endpoint (see webapp.py).
  CHESS_REVIEW_RATE_MAX = "12"
  CHESS_REVIEW_RATE_WINDOW = "60"
  CHESS_REVIEW_MAX_GAMES = "30"
  CHESS_REVIEW_MAX_PGN_BYTES = "1000000"
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 4
    soft_limit = 2

[[vm]]
  # Balanced: 1 dedicated CPU (not throttled like shared) at the cheapest
  # dedicated tier; fixed depth-18 stays accurate, scale-to-zero keeps it cheap.
  size = 'performance-1x'
  memory = '2048mb'
