<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>教练工作台 · Chess Review</title>
<style>
  :root {
    --ink:#18201d; --muted:#66706b; --line:#d9dedb; --paper:#f5f6f3;
    --surface:#ffffff; --green:#176b52; --green-soft:#e7f1ec;
    --amber:#9a6414; --amber-soft:#fff3d7; --red:#a43d37; --red-soft:#f9e9e7;
  }
  * { box-sizing:border-box; }
  body { margin:0; color:var(--ink); background:var(--paper); font-family:"Avenir Next","PingFang SC","Microsoft YaHei",sans-serif; letter-spacing:0; }
  button, input, textarea { font:inherit; letter-spacing:0; }
  button { cursor:pointer; }
  .shell { min-height:100vh; display:grid; grid-template-columns:280px minmax(0,1fr); }
  aside { background:#202a26; color:#f7faf8; min-height:100vh; padding:24px 18px; position:sticky; top:0; height:100vh; overflow:auto; }
  .brand { display:flex; align-items:center; gap:10px; padding:0 6px 22px; border-bottom:1px solid #3a4641; }
  .mark { width:30px; height:30px; display:grid; place-items:center; border:1px solid #718079; font-family:Georgia,serif; font-size:20px; }
  .brand strong { display:block; font-family:Georgia,"Songti SC",serif; font-size:18px; font-weight:600; }
  .brand span { color:#aeb9b4; font-size:11px; }
  .nav-close { display:none; position:absolute; right:12px; top:12px; width:36px; height:36px; border:0; background:transparent; color:#fff; font-size:26px; line-height:1; }
  nav { padding:18px 0; }
  nav a { color:#e6ece9; text-decoration:none; display:flex; gap:10px; align-items:center; padding:9px 10px; font-size:13px; border-left:2px solid transparent; }
  nav a.active { background:#2b3832; border-left-color:#77b89f; color:#fff; }
  nav a:hover { background:#2b3832; }
  .aside-label { color:#89968f; font-size:10px; text-transform:uppercase; margin:22px 10px 7px; }
  .main { min-width:0; }
  header { height:68px; border-bottom:1px solid var(--line); background:rgba(255,255,255,.94); display:flex; align-items:center; justify-content:space-between; padding:0 30px; position:sticky; top:0; z-index:5; }
  header h1 { margin:0; font-family:Georgia,"Songti SC",serif; font-size:22px; font-weight:600; }
  header a { color:var(--green); text-decoration:none; font-size:13px; }
  main { padding:26px 30px 54px; max-width:1500px; margin:0 auto; }
  .summary { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); border:1px solid var(--line); background:var(--surface); margin-bottom:22px; }
  .summary > div { padding:17px 20px; border-right:1px solid var(--line); }
  .summary > div:last-child { border-right:0; }
  .summary b { display:block; font-family:Georgia,serif; font-size:25px; font-weight:600; }
  .summary span { color:var(--muted); font-size:12px; }
  .workspace { display:grid; grid-template-columns:minmax(330px,.9fr) minmax(500px,1.6fr); gap:22px; align-items:start; }
  .workspace > *, .section { min-width:0; }
  .section { border-top:3px solid var(--ink); background:var(--surface); }
  .section-head { min-height:58px; padding:13px 16px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line); gap:12px; }
  .section-head h2 { margin:0; font-size:15px; }
  .section-actions { display:flex; align-items:center; justify-content:flex-end; gap:8px; min-width:0; }
  .search { width:min(190px,50%); border:1px solid var(--line); border-radius:4px; padding:7px 9px; background:#fafbfa; }
  .primary { min-height:36px; border:1px solid var(--green); border-radius:4px; background:var(--green); color:#fff; padding:7px 12px; font-weight:700; white-space:nowrap; }
  .primary:hover { background:#105740; }
  .primary:disabled { cursor:wait; opacity:.65; }
  .secondary { min-height:36px; border:1px solid var(--line); border-radius:4px; background:#fff; color:var(--ink); padding:7px 12px; }
  .students { max-height:calc(100vh - 230px); overflow:auto; }
  .student { width:100%; border:0; border-bottom:1px solid var(--line); background:#fff; padding:14px 16px; text-align:left; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:5px 12px; }
  .student:hover, .student.active { background:#f0f5f2; }
  .student.active { box-shadow:inset 3px 0 var(--green); }
  .student-name { font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .student-meta { font-size:12px; color:var(--muted); }
  .coverage { font-variant-numeric:tabular-nums; color:var(--green); font-size:12px; }
  .empty { padding:36px 20px; color:var(--muted); text-align:center; font-size:13px; }
  .detail { min-height:420px; }
  .identity { padding:18px 20px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:18px; }
  .identity h2 { font-family:Georgia,"Songti SC",serif; font-size:24px; margin:0 0 4px; }
  .identity p { margin:0; color:var(--muted); font-size:12px; overflow-wrap:anywhere; }
  .badge { display:inline-flex; align-items:center; min-height:24px; padding:3px 8px; border-radius:3px; background:var(--green-soft); color:var(--green); font-size:11px; font-weight:700; white-space:nowrap; }
  .badge.warn { background:var(--amber-soft); color:var(--amber); }
  .badge.bad { background:var(--red-soft); color:var(--red); }
  .facts { display:grid; grid-template-columns:repeat(4,1fr); border-bottom:1px solid var(--line); }
  .fact { padding:14px 16px; border-right:1px solid var(--line); }
  .fact:last-child { border-right:0; }
  .fact b { display:block; font-size:18px; }
  .fact b { overflow-wrap:anywhere; }
  .fact span { color:var(--muted); font-size:11px; }
  .block { padding:18px 20px; border-bottom:1px solid var(--line); }
  .block:last-child { border-bottom:0; }
  .block-title { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .block-title h3 { margin:0; font-size:14px; }
  .block-title span { color:var(--muted); font-size:11px; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th { color:var(--muted); font-weight:600; text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); }
  td { padding:9px 8px; border-bottom:1px solid #edf0ee; }
  th.num, td.num { text-align:right; font-variant-numeric:tabular-nums; }
  .direction { font-weight:700; }
  .direction.improving { color:var(--green); }
  .direction.declining { color:var(--red); }
  .direction.stable { color:var(--muted); }
  .accounts { display:grid; gap:8px; }
  .account { display:grid; grid-template-columns:100px minmax(0,1fr) auto; align-items:center; gap:12px; border:1px solid var(--line); padding:10px 12px; }
  .account strong { text-transform:capitalize; font-size:12px; }
  .account small { color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .account small a { color:var(--green); text-decoration:none; }
  .account-actions { display:flex; align-items:center; justify-content:flex-end; gap:7px; }
  .mini { min-height:28px; border:1px solid var(--line); border-radius:3px; background:#fff; color:var(--green); padding:4px 8px; font-size:11px; font-weight:700; white-space:nowrap; }
  .block-actions { display:flex; align-items:center; gap:7px; }
  .loading { padding:80px 20px; text-align:center; color:var(--muted); }
  .error { color:var(--red); background:var(--red-soft); border:1px solid #edc5c1; padding:12px 14px; margin-bottom:18px; }
  .notice { color:var(--green); background:var(--green-soft); border:1px solid #b9d8ca; padding:12px 14px; margin-bottom:18px; }
  .mobile-menu { display:none; border:0; background:transparent; font-size:22px; }
  dialog { width:min(480px,calc(100vw - 32px)); border:0; border-top:4px solid var(--green); padding:0; color:var(--ink); background:var(--surface); box-shadow:0 20px 60px rgba(24,32,29,.25); }
  dialog::backdrop { background:rgba(24,32,29,.56); }
  .dialog-head { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px 20px; border-bottom:1px solid var(--line); }
  .dialog-head h2 { margin:0; font-family:Georgia,"Songti SC",serif; font-size:21px; }
  .dialog-close { width:36px; height:36px; border:0; background:transparent; color:var(--muted); font-size:26px; line-height:1; }
  .student-form { padding:20px; display:grid; gap:17px; }
  .field { display:grid; gap:7px; }
  .field[hidden] { display:none; }
  .field label { font-size:12px; font-weight:700; }
  .field input, .field textarea, .field select { width:100%; border:1px solid var(--line); border-radius:4px; padding:10px 11px; background:#fafbfa; color:var(--ink); }
  .field textarea { min-height:104px; resize:vertical; }
  .form-error { min-height:18px; color:var(--red); font-size:12px; }
  .dialog-actions { display:flex; justify-content:flex-end; gap:8px; }
  @media (max-width:1180px) {
    .shell { grid-template-columns:1fr; }
    aside { display:block; position:fixed; left:0; top:0; width:280px; z-index:20; transform:translateX(-100%); transition:transform .18s ease; box-shadow:8px 0 24px rgba(0,0,0,.18); }
    body.nav-open aside { transform:translateX(0); }
    .nav-close { display:block; }
    header { padding:0 18px; }
    .mobile-menu { display:block; }
    main { padding:20px 16px 40px; }
    .workspace { grid-template-columns:1fr; }
    .students { max-height:360px; }
  }
  @media (max-width:620px) {
    .summary { grid-template-columns:repeat(2,1fr); }
    .summary > div:nth-child(2) { border-right:0; }
    .summary > div:nth-child(-n+2) { border-bottom:1px solid var(--line); }
    .facts { grid-template-columns:repeat(2,1fr); }
    .fact:nth-child(2) { border-right:0; }
    .fact:nth-child(-n+2) { border-bottom:1px solid var(--line); }
    .section-head { align-items:stretch; flex-direction:column; }
    .section-actions { justify-content:stretch; }
    .search { width:100%; }
    .section-actions .search { flex:1; }
    .identity { align-items:flex-start; }
    .identity h2 { font-size:21px; overflow-wrap:anywhere; }
    .account { grid-template-columns:80px minmax(0,1fr); }
    .account-actions { grid-column:2; justify-content:flex-start; flex-wrap:wrap; }
    .block-title { align-items:flex-start; gap:12px; }
    .block-actions { justify-content:flex-end; flex-wrap:wrap; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside>
    <button class="nav-close" aria-label="关闭导航">×</button>
    <div class="brand"><div class="mark">♜</div><div><strong>Chess Review</strong><span>Coach Intelligence</span></div></div>
    <nav>
      <a class="active" href="/coach"><span>▦</span>学员总览</a>
      <a href="/"><span>＋</span>单局分析</a>
      <div class="aside-label">工作流</div>
      <a href="#students"><span>◎</span>学员档案</a>
      <a href="#progress"><span>↗</span>长期趋势</a>
      <a href="#sources"><span>⇄</span>数据来源</a>
    </nav>
  </aside>
  <div class="main">
    <header><div style="display:flex;align-items:center;gap:12px"><button class="mobile-menu" aria-label="导航" aria-expanded="false">☰</button><h1>教练工作台</h1></div><a href="/">打开单局分析 →</a></header>
    <main>
      <div id="error"></div>
      <section class="summary" aria-label="档案概览">
        <div><b id="totalStudents">—</b><span>档案人数</span></div>
        <div><b id="totalGames">—</b><span>已收录对局</span></div>
        <div><b id="totalAnalyzed">—</b><span>已完成分析</span></div>
        <div><b id="syncIssues">—</b><span>同步需关注</span></div>
      </section>
      <div class="workspace">
        <section class="section" id="students">
          <div class="section-head"><h2>学员与观察对象</h2><div class="section-actions"><input class="search" id="search" type="search" placeholder="搜索姓名或账号"><button class="primary" id="openCreateStudent" type="button">＋ 新建学员</button></div></div>
          <div class="students" id="studentList"><div class="loading">正在读取档案…</div></div>
        </section>
        <section class="section detail" id="detail"><div class="loading">从左侧选择一位学员查看档案。</div></section>
      </div>
    </main>
  </div>
</div>
<dialog id="createStudentDialog">
  <div class="dialog-head"><h2>新建学员档案</h2><button class="dialog-close" id="closeCreateStudent" type="button" aria-label="关闭">×</button></div>
  <form class="student-form" id="createStudentForm">
    <div class="field"><label for="displayName">学员姓名</label><input id="displayName" name="display_name" maxlength="120" required autocomplete="off"></div>
    <div class="field"><label for="aliases">PGN 名称或平台用户名（可选，每行一个）</label><textarea id="aliases" name="aliases" maxlength="2420"></textarea></div>
    <div class="form-error" id="createStudentError" role="alert"></div>
    <div class="dialog-actions"><button class="secondary" id="cancelCreateStudent" type="button">取消</button><button class="primary" id="submitCreateStudent" type="submit">创建档案</button></div>
  </form>
</dialog>
<dialog id="sourceDialog">
  <div class="dialog-head"><h2>绑定数据来源</h2><button class="dialog-close" data-close-dialog="sourceDialog" type="button" aria-label="关闭">×</button></div>
  <form class="student-form" id="sourceForm">
    <div class="field"><label for="sourceType">平台</label><select id="sourceType"><option value="chess.com">Chess.com（自动同步）</option><option value="lichess">Lichess（自动同步）</option><option value="chessbase">ChessBase Players（资料链接）</option></select></div>
    <div class="field" id="sourceUsernameField"><label for="sourceUsername" id="sourceUsernameLabel">平台用户名</label><input id="sourceUsername" maxlength="120" autocomplete="off"></div>
    <div class="field" id="sourceUrlField" hidden><label for="sourceUrl">ChessBase Players 链接</label><input id="sourceUrl" type="url" maxlength="500" placeholder="https://players.chessbase.com/en/player/..." autocomplete="off"></div>
    <div class="form-error" id="sourceError" role="alert"></div>
    <div class="dialog-actions"><button class="secondary" data-close-dialog="sourceDialog" type="button">取消</button><button class="primary" id="submitSource" type="submit">绑定并同步</button></div>
  </form>
</dialog>
<dialog id="importDialog">
  <div class="dialog-head"><h2>导入 PGN 棋谱</h2><button class="dialog-close" data-close-dialog="importDialog" type="button" aria-label="关闭">×</button></div>
  <form class="student-form" id="importForm">
    <div class="field"><label for="importPgnFile">PGN 文件</label><input id="importPgnFile" type="file" accept=".pgn,application/x-chess-pgn,text/plain"></div>
    <div class="field"><label for="importPgnText">或粘贴 PGN 内容</label><textarea id="importPgnText" maxlength="1000000"></textarea></div>
    <div class="form-error" id="importError" role="alert"></div>
    <div class="dialog-actions"><button class="secondary" data-close-dialog="importDialog" type="button">取消</button><button class="primary" id="submitImport" type="submit">导入匹配对局</button></div>
  </form>
</dialog>
<script>
  const state = { students: [], selected: null };
  const el = (id) => document.getElementById(id);
  const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
  const pct = (value) => value == null ? "—" : `${Math.round(value * 100)}%`;
  const trendLabel = { improving:"改善", declining:"下降", stable:"稳定", mixed:"分化", insufficient_data:"证据不足" };
  const metricLabels = { acpl_median:"ACPL 中位数", blunders_per_100:"每百步严重失误", clean_game_rate:"无严重失误对局", score_pct:"得分率", conversion_win_rate:"优势转化率" };
  const percentageMetrics = new Set(["clean_game_rate", "score_pct", "conversion_win_rate"]);

  function showError(message) { el("error").innerHTML = `<div class="error">${esc(message)}</div>`; }
  function showNotice(message) { el("error").innerHTML = `<div class="notice">${esc(message)}</div>`; }
  function accountText(account) { return account.username || account.external_id; }
  function searchable(student) { return [student.display_name, ...student.aliases, ...student.accounts.map(accountText)].join(" ").toLowerCase(); }

  function renderList() {
    const query = el("search").value.trim().toLowerCase();
    const students = state.students.filter((student) => searchable(student).includes(query));
    if (!students.length) { el("studentList").innerHTML = '<div class="empty">没有匹配的学员档案。</div>'; return; }
    el("studentList").innerHTML = students.map((student) => `
      <button class="student ${student.person_id === state.selected ? "active" : ""}" data-id="${esc(student.person_id)}">
        <span class="student-name">${esc(student.display_name)}</span><span class="coverage">${pct(student.analysis_coverage)}</span>
        <span class="student-meta">${student.games} 局 · ${student.accounts.length} 个数据源</span><span class="student-meta">分析覆盖</span>
      </button>`).join("");
    document.querySelectorAll(".student").forEach((button) => button.addEventListener("click", () => selectStudent(button.dataset.id)));
  }

  function renderAccounts(accounts) {
    if (!accounts.length) return '<div class="empty">尚未绑定公开数据源。</div>';
    return `<div class="accounts">${accounts.map((account) => {
      const sync = account.sync;
      const automatic = account.source === "chess.com" || account.source === "lichess";
      const status = sync?.last_error ? "异常" : sync?.last_success_at ? "已同步" : automatic ? "未同步" : "资料链接";
      const cls = sync?.last_error ? "bad" : sync?.last_success_at || !automatic ? "" : "warn";
      let label = esc(accountText(account));
      if (account.profile_url) {
        try {
          const url = new URL(account.profile_url);
          if (url.protocol === "https:" || url.protocol === "http:") label = `<a href="${esc(url.href)}" target="_blank" rel="noopener">${label}</a>`;
        } catch (_) {}
      }
      return `<div class="account"><strong>${esc(account.source)}</strong><small>${label}</small><div class="account-actions"><span class="badge ${cls}">${status}</span>${automatic ? `<button class="mini" type="button" data-sync-account="${esc(account.account_id)}">↻ 同步</button>` : ""}</div></div>`;
    }).join("")}</div>`;
  }

  function value(metric, side, key) {
    const raw = metric[side];
    if (raw == null) return "—";
    return percentageMetrics.has(key) ? pct(raw) : raw;
  }

  function renderTrend(progress) {
    if (!progress || progress.status === "insufficient_data") {
      return `<div class="empty">当前有 ${progress?.available_games || 0} 盘可用于趋势分析，至少需要 ${progress?.required_games || 20} 盘有日期的对局。</div>`;
    }
    const rows = Object.entries(metricLabels).map(([key, label]) => {
      const metric = progress.metrics[key];
      return `<tr><td>${label}</td><td class="num">${value(metric,"before",key)}</td><td class="num">${value(metric,"after",key)}</td><td class="direction ${metric.status}">${trendLabel[metric.status]}</td></tr>`;
    }).join("");
    return `<div class="block-title"><h3>近期表现</h3><span>前 ${progress.window_games} 盘 vs 最近 ${progress.window_games} 盘 · ${progress.confidence === "high" ? "高" : "中"}置信度</span></div>
      <table><thead><tr><th>指标</th><th class="num">此前</th><th class="num">近期</th><th>方向</th></tr></thead><tbody>${rows}</tbody></table>`;
  }

  async function selectStudent(personId) {
    state.selected = personId;
    renderList();
    el("detail").innerHTML = '<div class="loading">正在整理学员档案…</div>';
    try {
      const response = await fetch(`/api/coach/students/${encodeURIComponent(personId)}`);
      const data = await response.json();
      if (!response.ok || !data.ok) throw new Error(data.error || "无法读取学员档案");
      const student = data.student, report = data.report, progress = report.progress;
      el("detail").innerHTML = `
        <div class="identity"><div><h2>${esc(student.display_name)}</h2><p>${student.aliases.map(esc).join(" · ")}</p></div><span class="badge ${progress?.status === "declining" ? "bad" : progress?.status === "insufficient_data" ? "warn" : ""}">${trendLabel[progress?.status] || "待分析"}</span></div>
        <div class="facts"><div class="fact"><b>${student.games}</b><span>收录对局</span></div><div class="fact"><b>${student.analyzed_games}</b><span>已分析</span></div><div class="fact"><b>${pct(student.analysis_coverage)}</b><span>分析覆盖</span></div><div class="fact"><b>${student.last_game_date || "—"}</b><span>最近对局</span></div></div>
        <div class="block" id="progress">${renderTrend(progress)}</div>
        <div class="block" id="sources"><div class="block-title"><div><h3>数据来源</h3><span>${student.accounts.length} 个账号</span></div><div class="block-actions"><button class="mini" id="openImport" type="button">⇧ 导入 PGN</button><button class="mini" id="openSource" type="button">＋ 绑定平台</button></div></div>${renderAccounts(student.accounts)}</div>`;
      el("openSource").addEventListener("click", () => el("sourceDialog").showModal());
      el("openImport").addEventListener("click", () => el("importDialog").showModal());
      document.querySelectorAll("[data-sync-account]").forEach((button) => button.addEventListener("click", () => syncAccount(button)));
    } catch (error) { el("detail").innerHTML = `<div class="error">${esc(error.message)}</div>`; }
  }

  async function syncAccount(button) {
    button.disabled = true;
    button.textContent = "同步中…";
    try {
      const response = await fetch(`/api/coach/students/${encodeURIComponent(state.selected)}/accounts/${encodeURIComponent(button.dataset.syncAccount)}/sync`, {method:"POST", headers:{"Content-Type":"application/json"}, body:"{}"});
      const data = await response.json();
      if (!response.ok || !data.ok) throw new Error(data.error || "平台同步失败");
      showNotice(`同步完成：发现 ${data.result.games_seen} 盘，新增 ${data.result.games_new} 盘，重复 ${data.result.games_duplicate} 盘。`);
      await loadDashboard(state.selected);
    } catch (error) {
      showError(error.message);
      button.disabled = false;
      button.textContent = "↻ 同步";
    }
  }

  async function loadDashboard(preferredPersonId = null) {
    try {
      const response = await fetch("/api/coach/students");
      const data = await response.json();
      if (!response.ok || !data.ok) throw new Error(data.error || "无法读取工作台");
      state.students = data.students;
      el("totalStudents").textContent = state.students.length;
      el("totalGames").textContent = state.students.reduce((sum, item) => sum + item.games, 0);
      el("totalAnalyzed").textContent = state.students.reduce((sum, item) => sum + item.analyzed_games, 0);
      el("syncIssues").textContent = state.students.reduce((sum, item) => sum + item.accounts.filter((account) => account.sync?.last_error).length, 0);
      state.selected = preferredPersonId || state.selected;
      renderList();
      if (state.students.length) selectStudent(
        state.students.some((student) => student.person_id === state.selected)
          ? state.selected : state.students[0].person_id
      );
      else el("detail").innerHTML = '<div class="empty">新建第一位学员，开始建立长期跟踪档案。</div>';
    } catch (error) { showError(error.message); el("studentList").innerHTML = '<div class="empty">工作台数据不可用。</div>'; }
  }

  const createDialog = el("createStudentDialog");
  function closeCreateStudent() {
    createDialog.close();
    el("createStudentForm").reset();
    el("createStudentError").textContent = "";
  }
  el("openCreateStudent").addEventListener("click", () => {
    createDialog.showModal();
    el("displayName").focus();
  });
  el("closeCreateStudent").addEventListener("click", closeCreateStudent);
  el("cancelCreateStudent").addEventListener("click", closeCreateStudent);
  createDialog.addEventListener("close", () => {
    el("createStudentForm").reset();
    el("createStudentError").textContent = "";
  });
  createDialog.addEventListener("click", (event) => {
    if (event.target === createDialog) closeCreateStudent();
  });
  el("createStudentForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    const submit = el("submitCreateStudent");
    const displayName = el("displayName").value.trim().replace(/\s+/g, " ");
    const aliases = el("aliases").value.split(/\n/).map((value) => value.trim().replace(/\s+/g, " ")).filter(Boolean);
    if (!displayName) {
      el("createStudentError").textContent = "请输入学员姓名。";
      return;
    }
    submit.disabled = true;
    el("createStudentError").textContent = "";
    try {
      const response = await fetch("/api/coach/students", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({display_name: displayName, aliases}),
      });
      const data = await response.json();
      if (!response.ok || !data.ok) throw new Error(data.error || "无法创建学员档案");
      const personId = data.student.person_id;
      closeCreateStudent();
      await loadDashboard(personId);
    } catch (error) {
      el("createStudentError").textContent = error.message;
    } finally {
      submit.disabled = false;
    }
  });

  function closeDialog(dialogId) {
    const dialog = el(dialogId);
    if (dialog.open) dialog.close();
  }
  document.querySelectorAll("[data-close-dialog]").forEach((button) => button.addEventListener("click", () => closeDialog(button.dataset.closeDialog)));

  function updateSourceFields() {
    const chessbase = el("sourceType").value === "chessbase";
    el("sourceUrlField").hidden = !chessbase;
    el("sourceUsernameLabel").textContent = chessbase ? "PGN 中的棋手名（可选）" : "平台用户名";
    el("sourceUsername").placeholder = chessbase ? "例如 Wu,S 或 Wu,Sibo" : "";
    el("submitSource").textContent = chessbase ? "保存资料链接" : "绑定并同步";
  }
  el("sourceType").addEventListener("change", updateSourceFields);
  el("sourceDialog").addEventListener("close", () => {
    el("sourceForm").reset();
    el("sourceError").textContent = "";
    updateSourceFields();
  });
  el("sourceForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    const submit = el("submitSource");
    const source = el("sourceType").value;
    submit.disabled = true;
    el("sourceError").textContent = "";
    try {
      const response = await fetch(`/api/coach/students/${encodeURIComponent(state.selected)}/accounts`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({source, username: el("sourceUsername").value.trim(), profile_url: el("sourceUrl").value.trim()}),
      });
      const data = await response.json();
      if (!response.ok || !data.ok) throw new Error(data.error || "无法绑定平台账号");
      if (source === "chessbase") {
        closeDialog("sourceDialog");
        showNotice("ChessBase 资料链接已保存。请通过 PGN 导入棋局。");
        await loadDashboard(state.selected);
        return;
      }
      const syncResponse = await fetch(`/api/coach/students/${encodeURIComponent(state.selected)}/accounts/${encodeURIComponent(data.account.account_id)}/sync`, {
        method: "POST", headers: {"Content-Type": "application/json"}, body: "{}",
      });
      const syncData = await syncResponse.json();
      closeDialog("sourceDialog");
      await loadDashboard(state.selected);
      if (!syncResponse.ok || !syncData.ok) {
        showError(`账号已绑定，但${syncData.error || "首次同步失败"}`);
        return;
      }
      showNotice(`账号已绑定：发现 ${syncData.result.games_seen} 盘，新增 ${syncData.result.games_new} 盘。`);
    } catch (error) {
      el("sourceError").textContent = error.message;
    } finally {
      submit.disabled = false;
    }
  });

  el("importPgnFile").addEventListener("change", async () => {
    const file = el("importPgnFile").files[0];
    if (!file) return;
    try {
      el("importPgnText").value = await file.text();
      el("importError").textContent = "";
    } catch (_) {
      el("importError").textContent = "无法读取该文件。";
    }
  });
  el("importDialog").addEventListener("close", () => {
    el("importForm").reset();
    el("importError").textContent = "";
  });
  el("importForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    const submit = el("submitImport");
    const pgn = el("importPgnText").value;
    if (!pgn.trim()) {
      el("importError").textContent = "请选择 PGN 文件或粘贴棋谱。";
      return;
    }
    submit.disabled = true;
    el("importError").textContent = "";
    try {
      const response = await fetch(`/api/coach/students/${encodeURIComponent(state.selected)}/games/import`, {
        method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({pgn}),
      });
      const data = await response.json();
      if (!response.ok || !data.ok) throw new Error(data.error || "无法导入棋谱");
      closeDialog("importDialog");
      showNotice(`导入完成：匹配 ${data.result.games_matched} 盘，新增 ${data.result.games_imported} 盘，重复 ${data.result.games_duplicate} 盘，跳过 ${data.result.games_skipped} 盘。`);
      await loadDashboard(state.selected);
    } catch (error) {
      el("importError").textContent = error.message;
    } finally {
      submit.disabled = false;
    }
  });
  el("search").addEventListener("input", renderList);
  document.querySelector(".mobile-menu").addEventListener("click", (event) => {
    const open = document.body.classList.toggle("nav-open");
    event.currentTarget.setAttribute("aria-expanded", String(open));
  });
  document.querySelector(".nav-close").addEventListener("click", () => {
    document.body.classList.remove("nav-open");
    document.querySelector(".mobile-menu").setAttribute("aria-expanded", "false");
  });
  document.querySelectorAll("aside a").forEach((link) => link.addEventListener("click", () => {
    document.body.classList.remove("nav-open");
    document.querySelector(".mobile-menu").setAttribute("aria-expanded", "false");
  }));
  loadDashboard();
</script>
</body>
</html>
